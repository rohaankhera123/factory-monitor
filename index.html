<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Factory Monitor</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f3f4f6;
      color: #111827;
    }

    .header {
      background: #111827;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .container {
      max-width: 1100px;
      margin: 25px auto;
      padding: 20px;
    }

    .login, .dashboard {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .machines {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .machine {
      padding: 20px;
      border-radius: 10px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
    }

    .running {
      color: green;
      font-weight: bold;
    }

    .stopped {
      color: red;
      font-weight: bold;
    }

    #dashboard {
      display: none;
    }

    .logout {
      background: #dc2626;
    }
  </style>
</head>

<body>

<div class="header">
  <h1>Factory Monitor</h1>
  <p>Printing & Packaging Factory</p>
</div>

<div class="container">

  <!-- LOGIN -->
  <div id="login" class="login">
    <h2>Factory Login</h2>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button onclick="login()">Login</button>

    <p id="message"></p>
  </div>

  <!-- DASHBOARD -->
  <div id="dashboard" class="dashboard">

    <h2>Factory Dashboard</h2>

    <p>Welcome to your factory monitoring system.</p>

    <div class="machines">

      <div class="machine">
        <h3>Heidelberg 6 Color</h3>
        <p>Status: <span class="running">Running</span></p>
      </div>

      <div class="machine">
        <h3>Die Cutting</h3>
        <p>Status: <span class="stopped">Stopped</span></p>
      </div>

      <div class="machine">
        <h3>Printing Machine 2</h3>
        <p>Status: <span class="running">Running</span></p>
      </div>

      <div class="machine">
        <h3>Packing</h3>
        <p>Status: <span class="running">Running</span></p>
      </div>

    </div>

    <button class="logout" onclick="logout()">Logout</button>

  </div>

</div>

<script>

  const SUPABASE_URL =
    "https://fvoycxceojwobeahfrtu.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_iOrVDUd4TTCQqtyytCWYSA_N4MMQuMd";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

  async function login() {

    const email =
      document.getElementById("email").value;

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("message");

    message.innerText = "Logging in...";

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {

      message.style.color = "red";
      message.innerText = error.message;

      return;
    }

    document.getElementById("login").style.display = "none";
    document.getElementById("dashboard").style.display = "block";
  }

  async function logout() {

    await supabaseClient.auth.signOut();

    document.getElementById("dashboard").style.display = "none";
    document.getElementById("login").style.display = "block";
  }

</script>

</body>
</html>
